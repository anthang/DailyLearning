[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Variables]
FontName=Segoe UI
TextColor=235,242,255,255
SecondaryColor=150,190,240,255
CardColor=20,28,42,240

; ===== HISTOIRE =====

[HistoryBackground]
Meter=Shape
Shape=Rectangle 0,0,350,220,14 | Fill Color #CardColor# | StrokeWidth 1 | Stroke Color 70,95,130,180

[HistoryTitle]
Meter=String
Text=HISTOIRE
FontFace=#FontName#
FontSize=16
FontWeight=700
FontColor=255,190,70,255
X=20
Y=20
AntiAlias=1

[HistoryText]
Meter=String
Text=1453 : la chute de Constantinople marque la fin de l'Empire byzantin.
FontFace=#FontName#
FontSize=12
FontColor=#TextColor#
X=20
Y=70
W=310
H=120
ClipString=2
AntiAlias=1

; ===== GEOGRAPHIE =====

[GeoBackground]
Meter=Shape
Shape=Rectangle 370,0,350,220,14 | Fill Color #CardColor# | StrokeWidth 1 | Stroke Color 70,95,130,180

[GeoTitle]
Meter=String
Text=GEOGRAPHIE
FontFace=#FontName#
FontSize=16
FontWeight=700
FontColor=70,180,255,255
X=390
Y=20
AntiAlias=1

[GeoText]
Meter=String
Text=L'Antarctique est le plus grand desert du monde, car il recoit tres peu de precipitations.
FontFace=#FontName#
FontSize=12
FontColor=#TextColor#
X=390
Y=70
W=310
H=120
ClipString=2
AntiAlias=1

